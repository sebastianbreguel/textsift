[package]
name = "textsift"
version = "0.1.0"
edition = "2021"
description = "Fast text deduplication CLI for ML dataset curation"
license = "MIT"
repository = "https://github.com/sebastianbreguel/textsift"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ahash = "0.8"
rayon = "1.10"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
