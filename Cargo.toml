[package]
name = "textsift"
version = "0.1.0"
edition = "2021"
description = "Fast text deduplication CLI for ML dataset curation"
license = "MIT"
repository = "https://github.com/sebastianbreguel/textsift"

[lib]
name = "textsift"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "textsift"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ahash = "0.8"
rayon = "1.10"
pyo3 = { version = "0.23", optional = true }

[features]
default = []
python = ["pyo3"]
# Only maturin enables this (see pyproject.toml): linking as an extension
# module breaks `cargo test --features python`, which needs libpython.
# abi3-py39 → one wheel covers every CPython >= 3.9.
extension-module = ["python", "pyo3/extension-module", "pyo3/abi3-py39"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
