[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "textsift"
version = "0.1.0"
description = "Fast text deduplication for ML datasets. 96x faster than datasketch."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
]
keywords = ["deduplication", "minhash", "lsh", "nlp", "ml", "dataset"]

[project.urls]
Homepage = "https://github.com/sebastianbreguel/textsift"
Repository = "https://github.com/sebastianbreguel/textsift"

[tool.maturin]
features = ["python"]
